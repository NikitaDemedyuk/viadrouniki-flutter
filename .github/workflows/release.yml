name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  apk:
    name: Release APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          git rev-parse --verify --quiet origin/main > /dev/null ||
            { echo "::error::origin/main is missing from the checkout"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: ./.github/actions/setup-flutter

      - name: Build
        run: |
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="viadrouniki-${GITHUB_REF_NAME}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
