name: Set up Flutter
description: Installs the Flutter SDK pinned in .fvmrc and JDK 21, then fetches pub dependencies.

runs:
  using: composite
  steps:
    - id: sdk
      shell: bash
      run: echo "version=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ steps.sdk.outputs.version }}
        cache: true

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    - shell: bash
      run: flutter pub get
